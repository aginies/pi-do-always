name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Validate release and select npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Release tag must match package.json version");
          }
          const prerelease = version.split("+")[0].includes("-");
          if (String(prerelease) !== process.env.RELEASE_PRERELEASE) {
            // tag and prerelease flag must agree
            throw new Error("Release prerelease flag mismatch");
          }
          console.log(`npm-tag=${prerelease ? "next" : "latest"}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Publish with npm Trusted Publishing
        # prepublishOnly runs `npm run typecheck && npm test` before publish.
        # Uses npm Trusted Publishing (OIDC); no stored npm token.
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.npm-tag }}
        run: npm publish --tag "$NPM_DIST_TAG"
